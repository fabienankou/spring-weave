spring.application.name=spring-weave
# Server Configuration
server.port=8081

# Database Configuration - Use H2 in-memory for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Application Configuration
application.name=SHOPIVERS
application.description=Plateforme E-Commerce Cross-Border
application.version=1.0.0

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.springweave=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
